# ======================================
# 自媒体博主专属配置 - Candy定制版
# 三层热点结构：全网大事件 → 平台级热点 → 垂直领域选题
# ======================================

# ======================================
# 🔑 三层关键词体系（严格按优先级）
# ======================================
keywords:
  # 【第一层：全国/全球级大热点】
  - "热点事件"
  - "热搜第一"
  - "突发新闻"
  - "全网热议"
  - "官方回应"
  - "政策出台"
  
  # 【第二层：垂直领域核心关键词】
  # 社交/人际关系/识人
  - "社交"
  - "人际关系"
  - "人情世故"
  - "识人"
  - "人性"
  - "情商"
  - "沟通"
  - "边界感"
  - "拒绝内耗"
  # 认知升级
  - "认知"
  - "认知升级"
  - "思维"
  - "格局"
  - "底层逻辑"
  - "信息差"
  - "觉醒"
  # 职场
  - "职场"
  - "工作"
  - "领导"
  - "同事"
  - "离职"
  - "裁员"
  - "副业"
  - "搞钱"
  # 情感
  - "情感"
  - "恋爱"
  - "婚姻"
  - "分手"
  - "原生家庭"
  - "亲密关系"
  - "男女"
  - "择偶"

# ======================================
# 📱 开启所有你需要的平台
# ======================================
platforms:
  # 主流平台全覆盖
  weibo: true           # 微博
  zhihu: true           # 知乎
  baidu: true           # 百度热搜（全国大事件）
  toutiao: true         # 头条热榜
  douyin: true          # 抖音
  bili: true            # B站
  xiaohongshu: true     # 小红书
  douban: true          # 豆瓣（需额外配置cookie，下面说明）
  # 科技/新闻
  36kr: true
  huxiu: true
  thepaper: true        # 澎湃新闻
  # 全球热点
  google: false         # 谷歌趋势（需科学上网，先关）
  bbc: false
  zhihu_hot: true
  weibo_hot: true

# ======================================
# 📊 数据过滤阈值
# ======================================
filter:
  min_heat: 500000           # 全网热点最低热度50万
  platform_thresholds:
    douyin:
      min_likes: 100000      # 抖音点赞≥10万
    xiaohongshu:
      min_likes: 20000       # 小红书点赞≥2万
    zhihu:
      min_votes: 5000        # 知乎赞同≥5000
    bili:
      min_views: 500000      # B站播放≥50万
    weibo:
      min_comments: 10000    # 微博评论≥1万
  exclude_ad: true           # 过滤广告
  exclude_star: true         # 过滤明星八卦（可改false）

# ======================================
# 🤖 AI分析配置 - 严格按你的要求输出
# ======================================
ai_analysis:
  enabled: true
  model: "github"
  temperature: 0.3
  include_standalone: true
  prompt: |
    你是资深自媒体内容总监，专门为知识类博主服务。请严格按照以下结构输出，不要有多余内容：
    
    【🌍 全网大事件】
    列出今天全国/全球最有讨论度的3个大事件，每个事件格式：
    - [标题](超链接) | 发布时间：YYYY-MM-DD
      🔥 热度：X万 | 💬 争议点：一句话说清楚为什么吵起来了，核心矛盾是什么
    
    【📱 各平台头部热点】
    分平台列出（抖音/小红书/B站/知乎/微博/豆瓣），每个平台2-3个最火的内容：
    - [标题](超链接) | 发布时间：YYYY-MM-DD
      ❤️ 点赞：X万 | ⭐ 收藏：X万 | 💬 评论：X万
      🔥 为什么火：一句话分析爆火原因，戳中了什么情绪/痛点
    
    【🎯 你的垂直领域选题】
    从社交/人际关系/识人/认知/职场/情感领域，列出今天最值得做的5个选题：
    - [选题方向] | 参考内容：[标题](超链接)
      📝 切入点建议：一句话说清楚你可以从什么角度讲，差异化在哪
    
    注意事项：
    1. 所有链接必须是可点击的超链接
    2. 数据必须真实，不要瞎编
    3. 争议点和爆火原因要一针见血，不要说废话
    4. 抖音只选10万赞以上，小红书只选2万赞以上
    5. 明星八卦、娱乐新闻除非有社会意义，否则不要放

# ======================================
# 🎨 显示格式配置
# ======================================
display:
  regions:
    hotlist: true
    new_items: true
    rss: false
    standalone: true
    ai_analysis: true
  max_items_per_platform: 3
  show_engagement: true           # 显示点赞/收藏/评论数据
  show_publish_time: true         # 显示发布时间
  show_url: true                  # 显示超链接
  link_format: "markdown"         # 飞书支持markdown链接
  heat_format: "wan"              # 热度用"万"做单位
  time_format: "YYYY-MM-DD"
  region_order: ["global", "platform", "niche"]  # 按三层结构排序

# ======================================
# ⏰ 推送配置
# ======================================
schedule:
  enabled: true
  preset: "custom"
  push_times:
    - "10:00"    # 每天上午10点准时推送
  only_when_new: true  # 没有新内容就不推，避免打扰

# ======================================
# 🔔 飞书推送配置（你已经在Secrets里填了webhook）
# ======================================
feishu:
  enabled: true
  msg_type: "interactive"  # 飞书卡片格式，更好看
  at_all: false
